name: Workspace compaction SQLite emulator tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-compaction-sqlite-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with SystemUI submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run isolated SQLite instrumentation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            ./gradlew :connectedLawnWithQuickstepGithubDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=app.lawnchair.util.WorkspaceCompactionSqliteTest
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-emulator-test-reports
          path: |
            build/reports/androidTests/
            build/outputs/androidTest-results/
          if-no-files-found: ignore
