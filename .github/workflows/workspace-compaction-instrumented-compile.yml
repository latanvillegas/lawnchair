name: Workspace compaction instrumented test compilation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-compaction-test-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source and SystemUI submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Confirm Android SDK availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo 'Android SDK is not configured'; exit 1; }
          test -d "$ANDROID_HOME" || { echo 'Android SDK directory is missing'; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
          java -version
      - name: Compile SQLite instrumentation tests (do not execute)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :compileLawnWithQuickstepGithubDebugAndroidTestKotlin --no-daemon --stacktrace
